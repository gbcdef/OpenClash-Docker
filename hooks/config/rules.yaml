# Keep private networks reachable before any subscription or per-client proxy
# rule can capture them.
version: 1
position: top
rules:
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  # Tailscale's admin console is blocked when the subscription routes the
  # whole public control-plane suffix directly.
  - DOMAIN,console.tailscale.com,Proxy
