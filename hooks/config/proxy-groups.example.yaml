# Copy this file to proxy-groups.yaml to enable the proxy-group hook.
# These groups consume nodes from the provider generated by oixCloud.
version: 1
groups:
  - name: 地区自动选择
    type: select
    proxies:
      - 香港自动
      - 台湾自动
      - 新加坡自动
      - 日本自动
      - 美国自动
      - 英国自动

  - name: 香港自动
    type: url-test
    use:
      - oixCloud
    filter: "(^🇭🇰|香港)"
    url: http://cp.cloudflare.com/generate_204
    interval: 3600

  - name: 新加坡自动
    type: url-test
    use:
      - oixCloud
    filter: "(^🇸🇬|新加坡)"
    url: http://cp.cloudflare.com/generate_204
    interval: 3600

  - name: 台湾自动
    type: url-test
    use:
      - oixCloud
    filter: "(^🇨🇳.*(台湾|台灣)|台湾|台灣)"
    url: http://cp.cloudflare.com/generate_204
    interval: 3600

  - name: 日本自动
    type: url-test
    use:
      - oixCloud
    filter: "(^🇯🇵|日本)"
    url: http://cp.cloudflare.com/generate_204
    interval: 3600

  - name: 美国自动
    type: url-test
    use:
      - oixCloud
    filter: "(^🇺🇸|美国|美國)"
    url: http://cp.cloudflare.com/generate_204
    interval: 3600

  - name: 英国自动
    type: url-test
    use:
      - oixCloud
    filter: "(^🇬🇧|英国|英國)"
    url: http://cp.cloudflare.com/generate_204
    interval: 3600

# Add custom selectors to an existing group without deleting its original
# provider, automatic, direct, or individual-node choices.
prepend-to:
  Proxy:
    - 地区自动选择

# Optionally prepend an already existing group to a subscription-defined
# selector. A missing target selector is skipped for provider portability.
prepend-existing-to:
  Microsoft:
    - Proxy
