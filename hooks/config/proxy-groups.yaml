  - name: 马来西亚自动
    type: url-test
    use: [oixCloud]
    filter: "(^🇲🇾|马来西亚|馬來西亞)"
    url: http://cp.cloudflare.com/generate_204
    interval: 3600

# Put the regional selector first without removing existing automatic,
# provider, direct, or individual-node choices.
prepend-to:
  Proxy:
    - 地区自动选择

# Microsoft is subscription-defined and optional. If present, prefer Proxy.
prepend-existing-to:
  Microsoft:
    - Proxy
