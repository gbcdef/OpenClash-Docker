  - name: 菲律宾自动
    type: url-test
    use: [oixCloud]
    filter: "(^🇵🇭|菲律宾|菲律賓)"
    url: http://cp.cloudflare.com/generate_204
    interval: 3600

  - name: 阿根廷自动
    type: url-test
    use: [oixCloud]
    filter: "(^🇦🇷|阿根廷)"
    url: http://cp.cloudflare.com/generate_204
