# Build source-specific regional latency groups without merging subscriptions.
version: 2

selector:
  name: 地区自动选择

url-test:
  url: http://cp.cloudflare.com/generate_204
  interval: 3600

profiles:
  - name: oix-provider
    match:
      provider: oixCloud
      groups: [Proxy]
    source:
      type: provider
      provider: oixCloud
    regions:
      - hong-kong
      - taiwan
      - singapore
      - japan
      - south-korea
      - united-states
      - russia
      - canada
      - india
      - turkey
      - mexico
      - nigeria
      - brazil
      - germany
      - france
      - thailand
      - australia
      - united-kingdom
      - philippines
      - argentina
      - malaysia
    prepend-to: Proxy
    prepend-existing-to:
      Microsoft: [Proxy]

  # Match a self-contained subscription with inline proxies and its own rules.
  # Requiring the main group keeps unrelated inline configurations untouched.
  - name: inline-subscription
    match:
      inline-proxies: true
      groups: [守候网络]
    source:
      type: inline
    regions:
      - hong-kong
      - taiwan
      - singapore
      - japan
      - south-korea
      - united-states
      - russia
      - canada
      - india
      - turkey
      - mexico
      - nigeria
      - brazil
      - germany
      - france
      - thailand
      - australia
      - united-kingdom
      - philippines
      - argentina
      - malaysia
      - mainland-china
      - united-arab-emirates
      - pakistan
      - ukraine
      - vietnam
    prepend-to: 守候网络

regions:
  hong-kong:
    name: 香港自动
    filter: "(^🇭🇰|香港(?!.*(阿根廷|菲律宾|Edge)))"
  taiwan:
    name: 台湾自动
    filter: "(^🇨🇳.*(台湾|台灣)|台湾|台灣)"
  singapore:
    name: 新加坡自动
    filter: "(^🇸🇬|新加坡)"
  japan:
    name: 日本自动
    filter: "(^🇯🇵|日本)"
  south-korea:
    name: 韩国自动
    filter: "(^🇰🇷|韩国|韓國)"
  united-states:
    name: 美国自动
    filter: "(^🇺🇸|美国|美國)"
  russia:
    name: 俄罗斯自动
    filter: "(^🇷🇺|俄罗斯|俄羅斯)"
  canada:
    name: 加拿大自动
    filter: "(^🇨🇦|加拿大)"
  india:
    name: 印度自动
    filter: "(^🇮🇳|印度)"
  turkey:
    name: 土耳其自动
    filter: "(^🇹🇷|土耳其)"
  mexico:
    name: 墨西哥自动
    filter: "(^🇲🇽|墨西哥)"
  nigeria:
    name: 尼日利亚自动
    filter: "(^🇳🇬|尼日利亚|尼日利亞)"
  brazil:
    name: 巴西自动
    filter: "(^🇧🇷|巴西)"
  germany:
    name: 德国自动
    filter: "(^🇩🇪|德国|德國)"
  france:
    name: 法国自动
    filter: "(^🇫🇷|法国|法國)"
  thailand:
    name: 泰国自动
    filter: "(^🇹🇭|泰国|泰國)"
  australia:
    name: 澳大利亚自动
    filter: "(^🇦🇺|澳大利亚|澳洲)"
  united-kingdom:
    name: 英国自动
    filter: "(^🇬🇧|英国|英國)"
  philippines:
    name: 菲律宾自动
    filter: "(^🇵🇭|菲律宾|菲律賓)"
  argentina:
    name: 阿根廷自动
    filter: "(^🇦🇷|阿根廷)"
  malaysia:
    name: 马来西亚自动
    filter: "(^🇲🇾|马来西亚|馬來西亞)"
  mainland-china:
    name: 中国大陆自动
    filter: "(^🇨🇳(?!.*(台湾|台灣|香港|澳门|澳門))|中国大陆|中國大陸|大陆|大陸)"
  united-arab-emirates:
    name: 阿联酋自动
    filter: "(^🇦🇪|阿联酋|阿聯酋|迪拜|杜拜)"
  pakistan:
    name: 巴基斯坦自动
    filter: "(^🇵🇰|巴基斯坦)"
  ukraine:
    name: 乌克兰自动
    filter: "(^🇺🇦|乌克兰|烏克蘭)"
  vietnam:
    name: 越南自动
    filter: "(^🇻🇳|越南)"
