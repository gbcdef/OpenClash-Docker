# Add regional latency-test groups for the provider generated by oixCloud.
version: 1
groups:
  - name: 地区自动选择
    type: select
    proxies:
      - 香港自动
      - 台湾自动
      - 新加坡自动
      - 日本自动
      - 韩国自动
      - 美国自动
      - 俄罗斯自动
      - 加拿大自动
      - 印度自动
      - 土耳其自动
      - 墨西哥自动
      - 尼日利亚自动
      - 巴西自动
      - 德国自动
      - 法国自动
      - 泰国自动
      - 澳大利亚自动
      - 英国自动
      - 菲律宾自动
      - 阿根廷自动
      - 马来西亚自动

  - name: 香港自动
    type: url-test
    use: [oixCloud]
    filter: "(^🇭🇰|香港(?!.*(阿根廷|菲律宾|Edge)))"
    url: http://cp.cloudflare.com/generate_204
    interval: 3600

  - name: 台湾自动
    type: url-test
    use: [oixCloud]
    filter: "(^🇨🇳.*(台湾|台灣)|台湾|台灣)"
    url: http://cp.cloudflare.com/generate_204
    interval: 3600

  - name: 新加坡自动
    type: url-test
    use: [oixCloud]
    filter: "(^🇸🇬|新加坡)"
    url: http://cp.cloudflare.com/generate_204
    interval: 3600

  - name: 日本自动
    type: url-test
    use: [oixCloud]
    filter: "(^🇯🇵|日本)"
    url: http://cp.cloudflare.com/generate_204
    interval: 3600

  - name: 韩国自动
    type: url-test
    use: [oixCloud]
    filter: "(^🇰🇷|韩国|韓國)"
    url: http://cp.cloudflare.com/generate_204
