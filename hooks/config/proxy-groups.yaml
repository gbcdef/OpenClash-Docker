  - name: 美国自动
    type: url-test
    use: [oixCloud]
    filter: "(^🇺🇸|美国|美國)"
    url: http://cp.cloudflare.com/generate_204
    interval: 3600

  - name: 俄罗斯自动
    type: url-test
    use: [oixCloud]
    filter: "(^🇷🇺|俄罗斯|俄羅斯)"
    url: http://cp.cloudflare.com/generate_204
    interval: 3600

  - name: 加拿大自动
    type: url-test
    use: [oixCloud]
    filter: "(^🇨🇦|加拿大)"
    url: http://cp.cloudflare.com/generate_204
    interval: 3600

  - name: 印度自动
    type: url-test
    use: [oixCloud]
    filter: "(^🇮🇳|印度)"
    url: http://cp.cloudflare.com/generate_204
    interval: 3600

  - name: 土耳其自动
    type: url-test
    use: [oixCloud]
    filter: "(^🇹🇷|土耳其)"
    url: http://cp.cloudflare.com/generate_204
    interval: 3600

  - name: 墨西哥自动
    type: url-test
    use: [oixCloud]
    filter: "(^🇲🇽|墨西哥)"
    url: http://cp.cloudflare.com/generate_204
    interval: 3600

  - name: 尼日利亚自动
    type: url-test
    use: [oixCloud]
    filter: "(^🇳🇬|尼日利亚|尼日利亞)"
    url: http://cp.cloudflare.com/generate_204
    interval: 3600

  - name: 巴西自动
    type: url-test
    use: [oixCloud]
    filter: "(^🇧🇷|巴西)"
    url: http://cp.cloudflare.com/generate_204
    interval: 3600

  - name: 德国自动
    type: url-test
    use: [oixCloud]
    filter: "(^🇩🇪|德国|德國)"
    url: http://cp.cloudflare.com/generate_204
    interval: 3600

  - name: 法国自动
    type: url-test
    use: [oixCloud]
    filter: "(^🇫🇷|法国|法國)"
    url: http://cp.cloudflare.com/generate_204
