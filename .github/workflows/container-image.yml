name: Build container image

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  SMOKE_IMAGE: openclash-docker:smoke

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select image tags
        id: image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image_name="${GITHUB_REPOSITORY,,}"
          openclash_release="$(sed -n 's/^ARG OPENCLASH_RELEASE=//p' Dockerfile)"
          if [[ -z "$openclash_release" || "$openclash_release" == *$'\n'* ]]; then
            echo "Dockerfile must define exactly one OPENCLASH_RELEASE default" >&2
            exit 1
          fi
          if [[ "$openclash_release" == latest ]]; then
            openclash_release="$(
              gh api repos/vernesong/OpenClash/releases/latest --jq .tag_name
            )"
          fi
          openclash_release="${openclash_release#v}"
          revision_tag="sha-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            primary_tag="${GITHUB_REF#refs/tags/}"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            primary_tag="latest"
          else
            echo "Unexpected ref for push-only workflow: $GITHUB_REF" >&2
            exit 1
          fi
          echo "name=$REGISTRY/$image_name" >> "$GITHUB_OUTPUT"
          echo "openclash_release=$openclash_release" >> "$GITHUB_OUTPUT"
          echo "primary_tag=$primary_tag" >> "$GITHUB_OUTPUT"
          echo "revision_tag=$revision_tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" |
            docker login "$REGISTRY" \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Build image
        shell: bash
        run: |
          docker build \
            --build-arg OPENWRT_IMAGE=openwrt/rootfs:x86_64-24.10.8 \
            --build-arg OPENCLASH_RELEASE=${{ steps.image.outputs.openclash_release }} \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=${{ steps.image.outputs.openclash_release }}" \
            --tag "$SMOKE_IMAGE" \
            --tag "${{ steps.image.outputs.name }}:${{ steps.image.outputs.primary_tag }}" \
            --tag "${{ steps.image.outputs.name }}:${{ steps.image.outputs.revision_tag }}" \
            .

      - name: Smoke test container
        shell: bash
        env:
          OPENCLASH_RELEASE: ${{ steps.image.outputs.openclash_release }}
        run: |
          wait_for_health() {
            for attempt in $(seq 1 24); do
              status="$(docker inspect --format '{{.State.Health.Status}}' openclash-smoke)"
              if [[ "$status" == healthy ]]; then
                return 0
              fi
              if [[ "$status" == unhealthy ]]; then
                docker logs openclash-smoke
                return 1
              fi
              sleep 5
            done
            docker logs openclash-smoke
            return 1
          }

          docker run --detach \
            --name openclash-smoke \
            --privileged \
            --env HOST_NETWORK=0 \
            --env ROOT_PASSWORD_FILE=/run/root_password \
            --volume "$GITHUB_WORKSPACE/secrets/root_password.example:/run/root_password:ro" \
            --volume openclash-smoke-config:/etc/config \
            --volume openclash-smoke-data:/etc/openclash \
            --health-cmd /usr/local/sbin/container-healthcheck \
            --health-interval 5s \
            --health-timeout 3s \
            --health-retries 12 \
            --health-start-period 20s \
            "$SMOKE_IMAGE"

          wait_for_health
          docker exec openclash-smoke sh -c \
            '! grep -Eq "::ask(first|console):" /etc/inittab'
          if docker exec openclash-smoke ps w |
            grep -Eq '(^|/)(login|login\.sh)( |$)'; then
            echo "Container console login process is running" >&2
            exit 1
          fi
          docker exec openclash-smoke /usr/local/sbin/container-healthcheck
          docker exec openclash-smoke test -x /etc/init.d/openclash
          docker exec openclash-smoke sh -c \
            "opkg status luci-app-openclash | grep -qx 'Version: $OPENCLASH_RELEASE'"
          docker exec openclash-smoke test -x \
            /usr/share/openclash/openclash_core.sh
          docker exec openclash-smoke test -x \
            /etc/openclash/core/clash_meta
          docker exec openclash-smoke sh -c \
            '/etc/openclash/core/clash_meta -v | grep -Fq "alpha-oix-"'
          docker exec openclash-smoke test -s \
            /etc/openclash/core/.packaged-oix-version
          for asset in \
            Country.mmdb \
            GeoIP.dat \
            GeoSite.dat \
            ASN.mmdb \
            china_ip_route.ipset \
            china_ip6_route.ipset; do
            docker exec openclash-smoke test -s "/etc/openclash/$asset"
          done
          docker exec openclash-smoke grep -Fq \
            'define china_ip_route = {' \
            /etc/openclash/china_ip_route.ipset
          docker exec openclash-smoke grep -Fq \
            'define china_ip6_route = {' \
            /etc/openclash/china_ip6_route.ipset
          docker exec openclash-smoke sh -c \
            "grep -Fq 'vernesong/mihomo-oix' /usr/share/openclash/openclash_core.sh"
          docker exec openclash-smoke test -f \
            /usr/lib/lua/luci/view/openclash/oix_login.htm
          docker exec openclash-smoke test -d \
            /etc/openclash/config
          docker exec openclash-smoke sh -c \
            'touch /etc/openclash/config/.write-test && rm -f /etc/openclash/config/.write-test'
          docker exec openclash-smoke grep -Fq \
            '/usr/local/sbin/openclash-oix-sync' \
            /usr/lib/lua/luci/controller/openclash.lua
          docker exec openclash-smoke sh -c \
            '! grep -Fq '\''curl -sL -m 10 --retry 2 --user-agent "clash"'\'' /usr/lib/lua/luci/controller/openclash.lua'
          docker exec openclash-smoke grep -Fq \
            "obj.stage === 'sync_error'" \
            /usr/lib/lua/luci/view/openclash/oix_login.htm
          docker exec openclash-smoke \
            /usr/local/share/openclash-tests/test-oix-sync.sh
          docker exec openclash-smoke sh -c \
            '[ "$(uci -q get openclash.config.enable)" = 0 ]'
          docker exec openclash-smoke test -x \
            /etc/openclash/custom/openclash_custom_overwrite.sh
          docker exec openclash-smoke test -x \
            /etc/openclash/custom/openclash_custom_firewall_rules.sh
          docker exec openclash-smoke \
            /bin/sh /usr/local/share/openclash-hooks/test-hooks.sh

          # OpenClash starts disabled until a user imports a configuration. Its
          # dedicated check must therefore fail without making the container
          # itself unhealthy.
          if docker exec openclash-smoke /usr/local/sbin/openclash-healthcheck; then
            echo "OpenClash unexpectedly reported running before configuration" >&2
            exit 1
          fi

          # Re-run the entrypoint with non-empty persistent directories. The
          # sentinels must survive, proving defaults never overwrite user data.
          docker exec openclash-smoke sh -c \
            "printf '\npersistence-sentinel\n' >> /etc/openclash/core/.packaged-oix-version"
          docker exec openclash-smoke sh -c \
            "printf '%s\n' \
              'proxy-providers:' \
              '  oixCloud: {type: http}' \
              'proxy-groups:' \
              '  - {name: Proxy, type: select, proxies: [DIRECT]}' \
              > '/etc/openclash/config/oixCloud - smart.yaml'; \
            uci -q set openclash.config.config_path='/etc/openclash/config/oixCloud - smart.yaml'; \
            uci -q commit openclash"
          docker exec openclash-smoke sh -c \
            "printf '\n# persistence-sentinel\n' >> /etc/config/openclash"
          docker restart openclash-smoke
          wait_for_health
          docker exec openclash-smoke sh -c \
            'touch /etc/.root-write-smoke && rm -f /etc/.root-write-smoke'
          docker exec openclash-smoke sh -c \
            '! grep -Eq "::ask(first|console):" /etc/inittab'
          if docker exec openclash-smoke ps w |
            grep -Eq '(^|/)(login|login\.sh)( |$)'; then
            echo "Container console login process is running after restart" >&2
            exit 1
          fi
          docker exec openclash-smoke grep -Fq \
            '# persistence-sentinel' \
            /etc/config/openclash
          docker exec openclash-smoke grep -Fq \
            'persistence-sentinel' \
            /etc/openclash/core/.packaged-oix-version
          docker exec openclash-smoke test -s \
            '/etc/openclash/config/oixCloud - smart.yaml'
          docker exec openclash-smoke sh -c \
            '[ "$(uci -q get openclash.config.config_path)" = "/etc/openclash/config/oixCloud - smart.yaml" ]'
          if docker logs openclash-smoke 2>&1 | grep -Fq 'find: unrecognized'; then
            echo "Entrypoint used an unsupported BusyBox find option" >&2
            exit 1
          fi
          if docker logs openclash-smoke 2>&1 | grep -Fq 'passwd:'; then
            echo "Successful password setup leaked into startup logs" >&2
            exit 1
          fi

      - name: Clean up smoke test
        if: always()
        shell: bash
        run: |
          docker rm --force openclash-smoke >/dev/null 2>&1 || true
          docker volume rm --force \
            openclash-smoke-config \
            openclash-smoke-data >/dev/null 2>&1 || true

      - name: Push image
        shell: bash
        run: |
          docker push "${{ steps.image.outputs.name }}:${{ steps.image.outputs.primary_tag }}"
          docker push "${{ steps.image.outputs.name }}:${{ steps.image.outputs.revision_tag }}"

      - name: Log out
        if: always()
        shell: bash
        run: docker logout "$REGISTRY"
